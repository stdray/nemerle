name: CI

on:
  push:
    branches: [retarget-compiler]
    tags: ['nuget']
  pull_request:
    branches: [retarget-compiler]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install tools
        run: |
          dotnet tool install -g Cake.Tool --version 5.0.0
          dotnet tool install -g dotnet-ildasm --version 1.0.3 || true

      - name: Build + Validate + Test
        run: dotnet-cake build.cake --target=CI -v diagnostic 2>&1 | tee ci-output.txt

      - name: Show test summary
        if: always()
        run: |
          echo "=== TEST RESULTS ==="
          grep -E "[0-9]+ tests (passed|failed)" ci-output.txt || echo "No test summary found"
          echo "=== INTERNAL ERRORS ==="
          grep -c "internal compiler error" ci-output.txt || echo "0"

      - name: Show validation
        if: always()
        run: |
          grep -E "(IL (identical|MISMATCH)|Validate:)" ci-output.txt

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: ci-output.txt

  nuget-publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/nuget'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.nproj', 'Nemerle.Compiler.Package.csproj') }}

      - name: Install tools
        run: |
          dotnet tool install -g Cake.Tool --version 5.0.0
          dotnet tool install -g dotnet-ildasm --version 1.0.3 || true

      - name: Publish NuGet package (Stage3 → Validate → Pack → Push)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet-cake build.cake --target=NuGetPush --configuration=Release -v diagnostic 2>&1 | tee ci-nuget.txt

      - name: Upload NuGet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-log
          path: ci-nuget.txt
